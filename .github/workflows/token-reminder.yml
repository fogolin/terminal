name: NPM Token Expiry Reminder

on:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check expiry and open issue
        run: |
          EXPIRY="2026-08-01"
          TODAY=$(date +%Y-%m-%d)
          DAYS_LEFT=$(( ($(date -d "$EXPIRY" +%s) - $(date -d "$TODAY" +%s)) / 86400 ))
          if [ "$DAYS_LEFT" -le 14 ] && [ "$DAYS_LEFT" -ge 0 ]; then
            EXISTING=$(gh issue list --label "maintenance" --state open --search "NPM_TOKEN expires" --json number --jq length)
            if [ "$EXISTING" -eq 0 ]; then
              BODY=$(printf "## Action required\n\nNPM_TOKEN secret expires on %s.\n\n**Steps to rotate:**\n1. npmjs.com → Avatar → Access Tokens → delete old token\n2. Generate new Automation token with Read and write\n3. Repo Settings → Secrets → update NPM_TOKEN\n4. Update EXPIRY in .github/workflows/token-reminder.yml" "$EXPIRY")
              gh issue create \
                --title "NPM_TOKEN expires in ${DAYS_LEFT} days" \
                --body "$BODY" \
                --label "maintenance"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
