name: Release Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      TAG_EXISTS: ""
      RELEASE_VERSION: ""
      LATEST_CHANGES: ""
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Validate Version
        id: version_check
        run: |
          PACKAGE_VER=$(node -p "require('./package.json').version")

          echo "Detected Version - $PACKAGE_VER"

          if git rev-parse "$PACKAGE_VER" >/dev/null 2>&1; then
              echo "TAG_EXISTS=true" >> $GITHUB_ENV
              echo "::warning::Tag $PACKAGE_VER already exists. Skipping release process."
          else
              echo "TAG_EXISTS=false" >> $GITHUB_ENV
              echo "RELEASE_VERSION=$PACKAGE_VER" >> $GITHUB_ENV
          fi

      - name: Install Dependencies
        if: env.TAG_EXISTS == 'false'
        run: npm ci

      - name: Build
        if: env.TAG_EXISTS == 'false'
        run: npm run build

      - name: Build Changelog
        if: env.TAG_EXISTS == 'false'
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -n 1)

          LOG_FORMAT="- %s ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H))"

          if [ -z "$PREV_TAG" ]; then
              LATEST=$(git log --pretty=format:"$LOG_FORMAT" HEAD)
          else
              LATEST=$(git log --pretty=format:"$LOG_FORMAT" "$PREV_TAG"..HEAD)
          fi

          echo "LATEST_CHANGES<<EOF" >> $GITHUB_ENV
          echo "$LATEST" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          ALL_TAGS=$(git tag --sort=-version:refname)
          FULL_CHANGELOG=""

          if [ -z "$ALL_TAGS" ]; then
              FULL_CHANGELOG="## ${{ env.RELEASE_VERSION }}"$'\n'"$LATEST"
          else
              FULL_CHANGELOG="## ${{ env.RELEASE_VERSION }}"$'\n'"$LATEST"
              TAGS_ARRAY=($ALL_TAGS)
              for i in "${!TAGS_ARRAY[@]}"; do
                  CURRENT="${TAGS_ARRAY[$i]}"
                  NEXT="${TAGS_ARRAY[$((i + 1))]}"
                  if [ -z "$NEXT" ]; then
                      SECTION=$(git log --pretty=format:"$LOG_FORMAT" "$CURRENT")
                  else
                      SECTION=$(git log --pretty=format:"$LOG_FORMAT" "$NEXT".."$CURRENT")
                  fi
                  FULL_CHANGELOG="$FULL_CHANGELOG"$'\n\n'"## $CURRENT"$'\n'"$SECTION"
              done
          fi

          echo "$FULL_CHANGELOG" > changelog.txt

      - name: Prepare Archive
        if: env.TAG_EXISTS == 'false'
        run: |
          cd dist
          zip -r ../firelin-terminal.${{ env.RELEASE_VERSION }}.zip . -x "*.git*" ".github*" "*.gitignore*" "*.DS_Store*" "*.map"
          cd ../

      - name: Publish to npm
        if: env.TAG_EXISTS == 'false'
        run: npm publish --provenance --access public

      - name: Publish Tag and Release
        if: env.TAG_EXISTS == 'false'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "firelin-terminal.${{ env.RELEASE_VERSION }}.zip, changelog.txt"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          body: |
            ### Automated Release ${{ env.RELEASE_VERSION }}
            ${{ env.LATEST_CHANGES }}
