<div class="terminal-window scanline hidden" role="dialog" aria-label="Firelin terminal window">
  <div class="terminal-titlebar">
    <span class="terminal-title">firelin — bash</span>
    <div class="terminal-controls">
      <button class="terminal-btn btn-minimize" type="button" aria-label="Minimize terminal">&#x2013;</button>
      <button class="terminal-btn btn-close" type="button" aria-label="Close terminal">&#x2715;</button>
    </div>
  </div>
  <div class="terminal-body">
    <div class="terminal-overlay"></div>
    <div class="terminal-lines">
      <div class="terminal-input-row">
        <span class="terminal-prompt"></span><span class="terminal-input-display"></span><span
          class="terminal-cursor"></span>
        <input class="terminal-input-capture" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
          spellcheck="false" aria-label="Terminal input" />
      </div>
    </div>
  </div>

  <!-- Resize handles -->
  <div class="resize-handle resize-right"></div>
  <div class="resize-handle resize-bottom"></div>
  <div class="resize-handle resize-left"></div>
  <div class="resize-handle resize-bottom-right"></div>
  <div class="resize-handle resize-bottom-left"></div>
</div>
